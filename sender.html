<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dual Subtitle Chromecast Sender</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  button { width: 100%; padding: 8px; margin-top: 4px; font-size: 14px; cursor: pointer; }
  #castOut { margin-top: 20px; }
  .picked { font-size: 12px; color: #555; margin-top: 4px; word-break: break-all; }
  #status { margin-top: 16px; color: #555; white-space: pre-wrap; }
  google-cast-launcher { width: 32px; height: 32px; float: right; }
  .nav-link { display: inline-block; font-size: 13px; margin-bottom: 8px; }

  .remote { margin-top: 20px; }
  .remote-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .remote-row span { width: 60px; font-size: 13px; font-weight: bold; flex-shrink: 0; }
  .remote-row button { width: auto; flex: 1; padding: 14px; font-size: 18px; margin-top: 0; }
</style>
</head>
<body>
  <a class="nav-link" href="/preview.html">→ Subtitle style preview / tuning</a>
  <h2>Dual Subtitle Cast <google-cast-launcher id="castBtn"></google-cast-launcher></h2>

  <label>Video file</label>
  <button data-kind="video">Choose Video...</button>
  <div class="picked" id="pickedVideo">(none)</div>

  <label>Subtitle 1 (e.g. Chinese, top)</label>
  <button data-kind="sub1">Choose Subtitle 1...</button>
  <div class="picked" id="pickedSub1">(none)</div>

  <label>Subtitle 2 (e.g. English, bottom)</label>
  <button data-kind="sub2">Choose Subtitle 2...</button>
  <div class="picked" id="pickedSub2">(none)</div>

  <button id="castOut">Cast to Chromecast</button>
  <div id="status"></div>

  <div class="remote">
    <div style="font-size:13px;font-weight:bold;">Live subtitle sync (works while casting -- open this page on your phone if you're in the room with the TV)</div>
    <div class="remote-row">
      <span>Both</span>
      <button data-target="both" data-delta="-5">-5s</button>
      <button data-target="both" data-delta="-0.5">-0.5s</button>
      <button data-target="both" data-delta="0.5">+0.5s</button>
      <button data-target="both" data-delta="5">+5s</button>
    </div>
    <div class="remote-row">
      <span>Sub 1</span>
      <button data-target="sub1" data-delta="-5">-5s</button>
      <button data-target="sub1" data-delta="-0.5">-0.5s</button>
      <button data-target="sub1" data-delta="0.5">+0.5s</button>
      <button data-target="sub1" data-delta="5">+5s</button>
    </div>
    <div class="remote-row">
      <span>Sub 2</span>
      <button data-target="sub2" data-delta="-5">-5s</button>
      <button data-target="sub2" data-delta="-0.5">-0.5s</button>
      <button data-target="sub2" data-delta="0.5">+0.5s</button>
      <button data-target="sub2" data-delta="5">+5s</button>
    </div>
  </div>

  <p style="font-size:12px;color:#777;margin-top:16px;">
    On a keyboard, <b>PageUp/PageDown</b> do the same thing (Shift = sub 1 only, Ctrl = sub 2 only).
  </p>

<script>
  // Your custom dual-subtitle Receiver App ID registered in the Google Cast Developer Console
  const RECEIVER_APP_ID = "775775DC";

  const status = document.getElementById("status");
  function log(msg) { status.textContent = msg; console.log(msg); }

  // The sender page itself must be loaded from a secure context (https, or
  // http://localhost) for the Cast SDK to initialize. But the media URLs we
  // hand to the Chromecast device must point at this machine's LAN IP, since
  // "localhost" on the Chromecast would mean itself, not this PC. So we ask
  // the local server (which always knows its own LAN IP) for the right host
  // to use for media URLs, independent of how this page was opened.
  let mediaOrigin = window.location.origin;
  async function resolveMediaOrigin() {
    try {
      const res = await fetch("/whoami");
      const data = await res.json();
      mediaOrigin = `http://${data.lan_ip}:${data.port}`;
    } catch (e) {
      log("Could not resolve the LAN address; falling back to the current origin. Chromecast may not be able to reach it.");
    }
  }
  resolveMediaOrigin();

  // Names of the currently picked files, keyed by kind -- used to guess the
  // video's MIME type and to show what's selected. Paths themselves stay
  // server-side (in selection.json); the page never needs the raw path.
  const pickedNames = { video: null, sub1: null, sub2: null };
  const pickedPaths = { video: null, sub1: null, sub2: null };
  const pickedEls = { video: document.getElementById("pickedVideo"), sub1: document.getElementById("pickedSub1"), sub2: document.getElementById("pickedSub2") };

  async function loadSelection() {
    const res = await fetch("/selection");
    const data = await res.json();
    for (const kind of ["video", "sub1", "sub2"]) {
      if (data[kind]) {
        pickedPaths[kind] = data[kind];
        pickedNames[kind] = data[kind].split(/[\\/]/).pop();
        pickedEls[kind].textContent = pickedNames[kind];
      }
    }
  }
  loadSelection();

  document.querySelectorAll("button[data-kind]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const kind = btn.dataset.kind;
      pickedEls[kind].textContent = "Waiting for file dialog...";
      const res = await fetch("/pick?kind=" + kind);
      const data = await res.json();
      if (data.ok) {
        pickedPaths[kind] = data.path;
        pickedNames[kind] = data.name;
        pickedEls[kind].textContent = data.name;
      } else {
        pickedEls[kind].textContent = pickedNames[kind] || "(none)";
      }
    });
  });

  // Per-file delay/speed corrections tuned in preview.html are stored
  // server-side keyed by subtitle path -- fetch them just before casting so
  // the receiver starts already synced instead of at a flat zero offset.
  async function getSubAdjustment(kind) {
    if (!pickedPaths[kind]) return { offset: 0, speed: 1 };
    const res = await fetch("/sub_adjustment?path=" + encodeURIComponent(pickedPaths[kind]));
    return res.json();
  }

  let castContext = null;

  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (isAvailable) {
      initCastApi();
    } else {
      log("Cast SDK reported unavailable (isAvailable=false). Make sure you're using desktop Chrome.");
    }
  };

  // If the SDK callback never fires at all (script blocked, network issue, etc.)
  setTimeout(() => {
    if (!castContext) {
      log("Cast SDK did not initialize within 5 seconds. Press F12 to open DevTools Console and check for red errors (common causes: can't reach www.gstatic.com, or not using Chrome).");
    }
  }, 5000);

  function initCastApi() {
    castContext = cast.framework.CastContext.getInstance();
    castContext.setOptions({
      receiverApplicationId: RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.PAGE_SCOPED
    });
    log("Cast SDK ready. You can cast now.");
  }

  document.getElementById("castOut").addEventListener("click", () => {
    if (!castContext) {
      log("Cast SDK not initialized yet. Wait a moment or reload the page.");
      return;
    }
    if (!pickedNames.video) { log("Please choose a video file first."); return; }

    castContext.requestSession().then(async () => {
      const [adj1, adj2] = await Promise.all([getSubAdjustment("sub1"), getSubAdjustment("sub2")]);
      const session = castContext.getCurrentSession();
      const mediaInfo = new chrome.cast.media.MediaInfo(mediaOrigin + "/play?which=video", guessMime(pickedNames.video));
      mediaInfo.customData = {
        sub1Url: pickedNames.sub1 ? mediaOrigin + "/play?which=sub1" : null,
        sub2Url: pickedNames.sub2 ? mediaOrigin + "/play?which=sub2" : null,
        sub1Offset: adj1.offset, sub1Speed: adj1.speed,
        sub2Offset: adj2.offset, sub2Speed: adj2.speed
      };
      const request = new chrome.cast.media.LoadRequest(mediaInfo);
      session.loadMedia(request).then(
        () => log("Casting started: " + pickedNames.video),
        (err) => log("Cast failed: " + JSON.stringify(err))
      );
    }, (err) => {
      const detail = err && typeof err === "object"
        ? JSON.stringify(err, Object.getOwnPropertyNames(err))
        : JSON.stringify(err);
      log("Could not connect to Chromecast: code=" + (err && err.code) + " description=" + (err && err.description) + " raw=" + detail);
      console.error("requestSession rejected:", err);
    });
  });

  // Live subtitle-delay tuning while casting: from a keyboard (PageUp/PageDown,
  // Shift = sub1 only, Ctrl = sub2 only) or from the on-page touch buttons --
  // handy since the buttons work the same from a phone opening this same page
  // while standing in the room with the TV, no keyboard needed.
  const CONTROL_NAMESPACE = "urn:x-cast:com.dualsubcast.control";
  const OFFSET_STEP = 0.5; // seconds per key press / button tap

  function sendOffsetAdjustment(target, delta) {
    if (!castContext) { log("Not casting yet."); return; }
    const session = castContext.getCurrentSession();
    if (!session) { log("Not casting yet."); return; }
    session.sendMessage(CONTROL_NAMESPACE, { target, delta }).then(
      () => log(`Adjusted ${target} by ${delta > 0 ? "+" : ""}${delta}s`),
      (err) => log("Failed to send offset adjustment: " + JSON.stringify(err))
    );
  }

  document.addEventListener("keydown", (e) => {
    if (e.key !== "PageUp" && e.key !== "PageDown") return;
    e.preventDefault();
    const delta = e.key === "PageDown" ? OFFSET_STEP : -OFFSET_STEP;
    const target = e.shiftKey ? "sub1" : e.ctrlKey ? "sub2" : "both";
    sendOffsetAdjustment(target, delta);
  });

  document.querySelectorAll(".remote-row button[data-target]").forEach(btn => {
    btn.addEventListener("click", () => {
      sendOffsetAdjustment(btn.dataset.target, parseFloat(btn.dataset.delta));
    });
  });

  function guessMime(name) {
    if (/\.mp4$/i.test(name)) return "video/mp4";
    if (/\.webm$/i.test(name)) return "video/webm";
    if (/\.mkv$/i.test(name)) return "video/x-matroska";
    return "video/mp4";
  }
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
