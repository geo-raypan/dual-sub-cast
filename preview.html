<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dual Subtitle Style Preview</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #222; color: #eee; }
  .controls { max-width: 900px; margin: 0 auto 16px; display: flex; gap: 12px; flex-wrap: wrap; }
  .controls label { display: flex; flex-direction: column; font-size: 12px; }
  .controls select { padding: 6px; min-width: 200px; }

  .stage {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    background: black;
  }
  video { width: 100%; display: block; }

  /* 這一段跟 receiver/index.html 用的是同一份樣式，改這裡就能立刻看到效果 */
  #sub1, #sub2 {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    color: white;
    font-family: sans-serif;
    text-shadow: 0 0 4px black, 0 0 4px black, 0 0 4px black;
    pointer-events: none;
    white-space: pre-line;
    font-size: var(--sub-font-size, 4vh);
  }
  #sub1 { bottom: var(--sub1-bottom, 12vh); }
  #sub2 { bottom: var(--sub2-bottom, 5vh); }

  .tuner { max-width: 900px; margin: 16px auto 0; font-size: 13px; }
  .tuner .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .tuner .row span:first-child { width: 110px; flex-shrink: 0; }
  .tuner .row span:last-child { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .tuner input[type="range"] { flex: 1; }
  .tuner textarea { width: 100%; margin-top: 8px; font-family: monospace; font-size: 12px; background: #111; color: #9f9; border: 1px solid #444; padding: 6px; }
</style>
</head>
<body>
  <a href="/sender.html" style="display:inline-block;font-size:13px;margin-bottom:8px;color:#9cf;">← Back to sender</a>
  <div class="controls">
    <label>Video file
      <button data-kind="video">Choose Video...</button>
      <span id="pickedVideo" style="font-size:11px;word-break:break-all;">(none)</span>
    </label>
    <label>Subtitle 1 (top)
      <button data-kind="sub1">Choose Subtitle 1...</button>
      <span id="pickedSub1" style="font-size:11px;word-break:break-all;">(none)</span>
    </label>
    <label>Subtitle 2 (bottom)
      <button data-kind="sub2">Choose Subtitle 2...</button>
      <span id="pickedSub2" style="font-size:11px;word-break:break-all;">(none)</span>
    </label>
  </div>

  <div class="stage">
    <video id="player" controls></video>
    <div id="sub1"></div>
    <div id="sub2"></div>
  </div>

  <div class="tuner">
    <div class="row">
      <span>Font size</span>
      <input type="range" id="tuneFont" min="1" max="10" step="0.1" value="4">
      <span id="tuneFontVal">4vh</span>
    </div>
    <div class="row">
      <span>Subtitle 1 offset</span>
      <input type="range" id="tuneSub1" min="0" max="40" step="0.5" value="12">
      <span id="tuneSub1Val">12vh</span>
    </div>
    <div class="row">
      <span>Subtitle 2 offset</span>
      <input type="range" id="tuneSub2" min="0" max="40" step="0.5" value="5">
      <span id="tuneSub2Val">5vh</span>
    </div>
    <textarea id="cssOut" rows="4" readonly></textarea>
    <hr style="border-color:#444;margin:14px 0;">
    <div style="color:#9cf;margin-bottom:6px;">Per-file subtitle delay/speed (remembered per subtitle file):</div>
    <div class="row">
      <span>Sub1 delay (s)</span>
      <input type="range" id="delaySub1" min="-15" max="15" step="0.1" value="0">
      <span id="delaySub1Val">0.0s</span>
    </div>
    <div class="row">
      <span>Sub1 speed</span>
      <input type="range" id="speedSub1" min="0.8" max="1.2" step="0.001" value="1">
      <span id="speedSub1Val">1.000x</span>
    </div>
    <div class="row">
      <span>Sub2 delay (s)</span>
      <input type="range" id="delaySub2" min="-15" max="15" step="0.1" value="0">
      <span id="delaySub2Val">0.0s</span>
    </div>
    <div class="row">
      <span>Sub2 speed</span>
      <input type="range" id="speedSub2" min="0.8" max="1.2" step="0.001" value="1">
      <span id="speedSub2Val">1.000x</span>
    </div>
    <div id="adjustStatus" style="font-size:11px;color:#9f9;margin-top:4px;"></div>
    <button id="applyBtn" style="margin-top:8px;padding:8px;width:100%;cursor:pointer;">Apply to Chromecast (write to receiver and push to GitHub Pages)</button>
    <div id="applyStatus" style="margin-top:6px;color:#9f9;white-space:pre-wrap;"></div>
  </div>

<script>
  let cues1 = [], cues2 = [];
  const pickedNames = { video: null, sub1: null, sub2: null };
  const pickedPaths = { video: null, sub1: null, sub2: null };
  const subAdjust = { sub1: { offset: 0, speed: 1 }, sub2: { offset: 0, speed: 1 } };
  const pickedEls = { video: document.getElementById("pickedVideo"), sub1: document.getElementById("pickedSub1"), sub2: document.getElementById("pickedSub2") };
  const player = document.getElementById("player");
  const el1 = document.getElementById("sub1");
  const el2 = document.getElementById("sub2");

  // 跟 receiver/index.html 完全一樣的解析邏輯，同時吃 VTT 跟 SRT
  function parseVtt(text) {
    const cues = [];
    const blocks = text.replace(/\r/g, "").split(/\n\n+/);
    const timeRe = /(\d{2}:)?(\d{2}):(\d{2})[.,](\d{3})\s*-->\s*(\d{2}:)?(\d{2}):(\d{2})[.,](\d{3})/;
    for (const block of blocks) {
      const lines = block.split("\n").filter(l => l.trim() !== "" && l.trim() !== "WEBVTT");
      const timeLineIdx = lines.findIndex(l => timeRe.test(l));
      if (timeLineIdx === -1) continue;
      const m = lines[timeLineIdx].match(timeRe);
      const toSec = (h, mi, s, ms) => (h ? parseInt(h) * 3600 : 0) + parseInt(mi) * 60 + parseInt(s) + parseInt(ms) / 1000;
      const start = toSec(m[1] ? m[1].replace(":", "") : null, m[2], m[3], m[4]);
      const end = toSec(m[5] ? m[5].replace(":", "") : null, m[6], m[7], m[8]);
      const text = lines.slice(timeLineIdx + 1).join("\n").replace(/<[^>]+>/g, "");
      cues.push({ start, end, text });
    }
    return cues;
  }

  async function fetchCues(url) {
    if (!url) return [];
    const res = await fetch(url);
    return parseVtt(await res.text());
  }

  function cueTextAt(cues, t) {
    const hit = cues.find(c => t >= c.start && t <= c.end);
    return hit ? hit.text : "";
  }

  async function loadSelection() {
    const res = await fetch("/selection");
    const data = await res.json();
    for (const kind of ["video", "sub1", "sub2"]) {
      if (data[kind]) {
        pickedPaths[kind] = data[kind];
        pickedNames[kind] = data[kind].split(/[\\/]/).pop();
        pickedEls[kind].textContent = pickedNames[kind];
      }
    }
    await loadSubAdjustments();
    applySelection();
  }

  document.querySelectorAll("button[data-kind]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const kind = btn.dataset.kind;
      pickedEls[kind].textContent = "Waiting for file dialog...";
      const res = await fetch("/pick?kind=" + kind);
      const data = await res.json();
      if (data.ok) {
        pickedPaths[kind] = data.path;
        pickedNames[kind] = data.name;
        pickedEls[kind].textContent = data.name;
        if (kind === "sub1" || kind === "sub2") await loadSubAdjustments();
        applySelection();
      } else {
        pickedEls[kind].textContent = pickedNames[kind] || "(none)";
      }
    });
  });

  async function applySelection() {
    if (pickedNames.video) player.src = "/play?which=video";
    cues1 = await fetchCues(pickedNames.sub1 ? "/play?which=sub1" : null);
    cues2 = await fetchCues(pickedNames.sub2 ? "/play?which=sub2" : null);
  }

  player.addEventListener("timeupdate", () => {
    el1.textContent = cueTextAt(cues1, (player.currentTime - subAdjust.sub1.offset) * subAdjust.sub1.speed);
    el2.textContent = cueTextAt(cues2, (player.currentTime - subAdjust.sub2.offset) * subAdjust.sub2.speed);
  });

  loadSelection();

  // Per-file subtitle delay/speed: remembered server-side keyed by the
  // subtitle's absolute path, so picking the same file again later
  // auto-restores whatever correction was tuned in for it.
  const delaySub1 = document.getElementById("delaySub1"), delaySub1Val = document.getElementById("delaySub1Val");
  const speedSub1 = document.getElementById("speedSub1"), speedSub1Val = document.getElementById("speedSub1Val");
  const delaySub2 = document.getElementById("delaySub2"), delaySub2Val = document.getElementById("delaySub2Val");
  const speedSub2 = document.getElementById("speedSub2"), speedSub2Val = document.getElementById("speedSub2Val");
  const adjustStatus = document.getElementById("adjustStatus");

  async function loadSubAdjustments() {
    for (const kind of ["sub1", "sub2"]) {
      if (!pickedPaths[kind]) { subAdjust[kind] = { offset: 0, speed: 1 }; continue; }
      const res = await fetch("/sub_adjustment?path=" + encodeURIComponent(pickedPaths[kind]));
      subAdjust[kind] = await res.json();
    }
    delaySub1.value = subAdjust.sub1.offset; speedSub1.value = subAdjust.sub1.speed;
    delaySub2.value = subAdjust.sub2.offset; speedSub2.value = subAdjust.sub2.speed;
    updateAdjustLabels();
  }

  function updateAdjustLabels() {
    delaySub1Val.textContent = parseFloat(delaySub1.value).toFixed(1) + "s";
    speedSub1Val.textContent = parseFloat(speedSub1.value).toFixed(3) + "x";
    delaySub2Val.textContent = parseFloat(delaySub2.value).toFixed(1) + "s";
    speedSub2Val.textContent = parseFloat(speedSub2.value).toFixed(3) + "x";
  }

  let saveAdjustTimer = null;
  function onAdjustInput(kind) {
    subAdjust[kind] = {
      offset: parseFloat(kind === "sub1" ? delaySub1.value : delaySub2.value),
      speed: parseFloat(kind === "sub1" ? speedSub1.value : speedSub2.value)
    };
    updateAdjustLabels();
    if (!pickedPaths[kind]) return;
    adjustStatus.textContent = "Saving...";
    clearTimeout(saveAdjustTimer);
    saveAdjustTimer = setTimeout(async () => {
      await fetch("/sub_adjustment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: pickedPaths[kind], ...subAdjust[kind] })
      });
      adjustStatus.textContent = "Saved for " + pickedNames[kind];
    }, 400);
  }
  delaySub1.addEventListener("input", () => onAdjustInput("sub1"));
  speedSub1.addEventListener("input", () => onAdjustInput("sub1"));
  delaySub2.addEventListener("input", () => onAdjustInput("sub2"));
  speedSub2.addEventListener("input", () => onAdjustInput("sub2"));

  const root = document.documentElement.style;
  const tuneFont = document.getElementById("tuneFont");
  const tuneSub1 = document.getElementById("tuneSub1");
  const tuneSub2 = document.getElementById("tuneSub2");
  const tuneFontVal = document.getElementById("tuneFontVal");
  const tuneSub1Val = document.getElementById("tuneSub1Val");
  const tuneSub2Val = document.getElementById("tuneSub2Val");
  const cssOut = document.getElementById("cssOut");

  function updateTuner() {
    root.setProperty("--sub-font-size", tuneFont.value + "vh");
    root.setProperty("--sub1-bottom", tuneSub1.value + "vh");
    root.setProperty("--sub2-bottom", tuneSub2.value + "vh");
    tuneFontVal.textContent = tuneFont.value + "vh";
    tuneSub1Val.textContent = tuneSub1.value + "vh";
    tuneSub2Val.textContent = tuneSub2.value + "vh";
    cssOut.value =
`font-size: ${tuneFont.value}vh;
#sub1 { bottom: ${tuneSub1.value}vh; }
#sub2 { bottom: ${tuneSub2.value}vh; }`;
  }
  [tuneFont, tuneSub1, tuneSub2].forEach(el => el.addEventListener("input", updateTuner));
  updateTuner();

  const applyBtn = document.getElementById("applyBtn");
  const applyStatus = document.getElementById("applyStatus");
  applyBtn.addEventListener("click", async () => {
    applyBtn.disabled = true;
    applyStatus.style.color = "#9f9";
    applyStatus.textContent = "Applying: writing file and pushing...";
    try {
      const res = await fetch("/apply_style", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          font_size: parseFloat(tuneFont.value),
          sub1_bottom: parseFloat(tuneSub1.value),
          sub2_bottom: parseFloat(tuneSub2.value)
        })
      });
      const data = await res.json();
      if (data.ok) {
        applyStatus.style.color = "#9f9";
        applyStatus.textContent = "Applied and pushed successfully! Once GitHub Pages updates (about 1-2 minutes), the next cast will use the new style.";
      } else {
        applyStatus.style.color = "#f88";
        applyStatus.textContent = "Apply failed: " + data.error;
      }
    } catch (e) {
      applyStatus.style.color = "#f88";
      applyStatus.textContent = "Connection failed: " + e;
    } finally {
      applyBtn.disabled = false;
    }
  });
</script>
</body>
</html>
